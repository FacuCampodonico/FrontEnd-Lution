server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React Router: si no es un archivo, va index.html (sin cache,
    # así un deploy nuevo se ve sin forzar la recarga).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
